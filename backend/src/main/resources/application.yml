server:
  forward-headers-strategy: framework

spring:
  application:
    name: saife

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${DB_NAME:saife}
    username: ${DB_USERNAME:saife}
    password: ${DB_PASSWORD:saife}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      # 근거 검색(ruling R58): kind·발생형태·업종 필터는 HNSW 스캔 "뒤에" 걸린다(post-filter).
      # pgvector 기본 ef_search=40이면 후보 40개 안에 작은 kind(CASE_FATALITY ≈ 7%, 축으로 더 좁혀짐)가
      # 거의 안 들어와 벡터 다리가 비고 하이브리드가 키워드에만 기댄다. 200으로 올려 후보 폭을 넓힌다.
      # (pgvector 0.8.2 확인. iterative_scan은 쓰지 않는다.) 확장이 아직 없는 첫 Flyway 연결에서도
      # 점이 들어간 사용자 GUC라 SET 자체는 실패하지 않는다.
      connection-init-sql: SET hnsw.ef_search = 200

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 소유한다. 엔티티만 고치면 부팅 실패
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # 응답 JSON의 시각도 한국 기준으로 직렬화한다.
  # 법정 문서를 만드는 앱이라 화면과 출력물의 시각이 같아야 한다
  jackson:
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 20MB      # 현장 사진
      max-request-size: 100MB

  # ── Spring AI (Gemini) ──
  ai:
    retry:
      max-attempts: 1          # Spring AI 레벨 재시도 비활성 — 재시도는 앱 계층이 전담
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}      # 비어 있으면 DemoModeConfig가 데모 모드로 내린다 (부팅 실패 아님)
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}   # 2.5 계열은 신규 키에 제공 안 됨(404)
            temperature: 0.2   # 판정 보조라 낮게. 등급은 어차피 룰 엔진이 낸다
        embedding:
          # ⚠️ 상위 genai.api-key를 상속하지 않는다. 여기 안 넣으면 Vertex 모드로 떨어져
          #    "Google GenAI project-id must be set!"로 기동 실패한다.
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: gemini-embedding-2
              dimensions: 768
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: false

# ── JWT ──
jwt:
  secret: ${JWT_SECRET:change-me-in-env-at-least-32-characters-long}
  expiration-ms: 86400000

# ── 공공데이터포털 (B552468 게이트웨이) ──
# ⚠️ callApiId가 실제 데이터셋을 고른다. 잘못된 값은 에러가 아니라 다른 데이터셋을 반환한다.
public-api:
  kosha:
    base-url: https://apis.data.go.kr/B552468
    datasets:
      fatality:   { path: /news_api02/getNews_api02,                       call-api-id: "1040", key: "${KOSHA_KEY_FATALITY:}",  verify-field: keyword }
      guide:      { path: /koshaguide/getKoshaGuide,                       call-api-id: "1050", key: "${KOSHA_KEY_GUIDE:}",     verify-field: techGdlnNo }
      disaster:   { path: /disaster_api02/getdisaster_api02,               call-api-id: "1060", key: "${KOSHA_KEY_DISASTER:}",  verify-field: business }
    msds:
      list-path:   /msdschem1/getChemList001
      detail-path: /msdschem1/getChemDetail0{section}1
      key: "${KOSHA_KEY_MSDS:}"
  law:
    base-url: http://www.law.go.kr/DRF
    oc: ${LAW_OC:}            # serviceKey가 아니라 OC(기관코드). 파라미터명도 OC

# ── 위험성평가 도메인 ──
saife:
  demo-mode: ${SAIFE_DEMO_MODE:false}   # true면 모델 응답을 픽스처로 고정 (무대 오프라인 폴백)
  upload-dir: ${SAIFE_UPLOAD_DIR:./data/uploads}   # 현장 사진. /data/는 gitignore 대상
  accident-types: [FALL, CAUGHT, DROP, STRUCK, FIRE, PPE]
  media-dir: ${SAIFE_MEDIA_DIR:./data/media}   # 사진·PDF 디스크 캐시. /data/는 gitignore
  external:
    timeout-ms: 8000
    circuit-failures: 3
    circuit-open-ms: 60000
  index:
    enrich-parallelism: ${SAIFE_INDEX_ENRICH_PARALLELISM:5}   # 지침 enrichment 병렬도. 1 이하면 순차
    enrich-enabled: ${SAIFE_INDEX_ENRICH_ENABLED:true}        # 절단선 ⑤: false면 enrich를 안 부르고 원문 그대로 임베딩
    guide-pdf-text: ${SAIFE_INDEX_GUIDE_PDF_TEXT:true}        # 절단선 ③: false면 지침 PDF 본문을 안 받고 표지 청크만 생성

# ── Actuator (health만 노출. 모니터링 스택은 이번 범위 밖) ──
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    io.saife: DEBUG
    org.springframework.ai: INFO
