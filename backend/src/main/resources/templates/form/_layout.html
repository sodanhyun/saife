<!DOCTYPE html>
<!--
  법정 서식 공통 레이아웃.

  A4 인쇄를 전제로 한다. 화면에서 Ctrl+P → "PDF로 저장"하면 그대로 제출 가능한
  문서가 나온다. headless Chrome을 백엔드에 두지 않은 이유는 FormController 참조.

  인쇄 시 사라져야 하는 것(버튼, 안내)은 .no-print를 단다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, body)">
<head>
  <meta charset="UTF-8">
  <title th:text="${title}">법정 서식</title>
  <style>
    @page { size: A4; margin: 14mm 12mm; }

    * { box-sizing: border-box; }

    body {
      font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
      font-size: 10.5pt;
      line-height: 1.5;
      color: #111;
      margin: 0;
      padding: 16px;
      background: #f3f4f6;
    }

    .sheet {
      background: #fff;
      max-width: 210mm;
      margin: 0 auto;
      padding: 14mm 12mm;
      box-shadow: 0 1px 6px rgba(0,0,0,.12);
    }

    h1 {
      font-size: 17pt;
      text-align: center;
      letter-spacing: 6px;
      margin: 0 0 4px;
    }

    .subtitle { text-align: center; font-size: 9pt; color: #555; margin-bottom: 14px; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }

    th, td {
      border: 1px solid #333;
      padding: 5px 7px;
      vertical-align: top;
      word-break: break-all;
    }

    th { background: #eef1f5; font-weight: 600; text-align: center; white-space: nowrap; }

    td.label { background: #f7f8fa; font-weight: 600; text-align: center; white-space: nowrap; width: 110px; }

    .section-title {
      font-size: 11pt;
      font-weight: 700;
      margin: 16px 0 6px;
      padding-left: 6px;
      border-left: 4px solid #333;
    }

    .pre { white-space: pre-wrap; }

    .risk-high   { color: #b91c1c; font-weight: 700; }
    .risk-medium { color: #b45309; font-weight: 700; }
    .risk-low    { color: #166534; font-weight: 700; }

    .flag { font-size: 8.5pt; color: #555; }

    .notice {
      font-size: 8.5pt;
      color: #444;
      border: 1px solid #bbb;
      background: #fafafa;
      padding: 7px 9px;
      margin-top: 14px;
      line-height: 1.45;
    }

    .warn { border-color: #b91c1c; background: #fef2f2; color: #7f1d1d; }

    .sign { margin-top: 24px; text-align: right; font-size: 10pt; }
    .sign .line { display: inline-block; width: 180px; border-bottom: 1px solid #333; margin-left: 8px; }

    .toolbar { max-width: 210mm; margin: 0 auto 10px; text-align: right; }
    .toolbar button {
      font-family: inherit; font-size: 10pt; padding: 7px 16px; cursor: pointer;
      border: 1px solid #333; background: #111; color: #fff; border-radius: 4px;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .sheet { box-shadow: none; padding: 0; max-width: none; }
      .no-print { display: none !important; }
      table { page-break-inside: auto; }
      tr { page-break-inside: avoid; page-break-after: auto; }
      thead { display: table-header-group; }
    }
  </style>
</head>
<body>
<div class="toolbar no-print">
  <button type="button" onclick="window.print()">인쇄 / PDF로 저장</button>
</div>
<div class="sheet" th:replace="${body}">서식 본문</div>
</body>
</html>
