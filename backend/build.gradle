plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.saife'
version = '0.0.1-SNAPSHOT'
description = 'SAIFE — 위험성평가 AI Agent'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyManagement {
    imports {
        // Inufleet에서 검증된 버전. 올리기 전에 ai/config/SafeCandidateGoogleGenAiChatModel의
        // 버그 우회가 여전히 필요한지 먼저 확인할 것 (상위 버전에서 고쳐졌을 수 있음).
        mavenBom 'org.springframework.ai:spring-ai-bom:1.1.5'
    }
}

dependencies {
    // ── Spring Boot ──
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'   // Spring AI 스트리밍(Reactor)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf' // 법정 서식 HTML 템플릿

    // ── Actuator ──
    // ObservationRegistry 빈의 출처. ai/config/ToolCallingConfig가 요구한다.
    // 빼면 "required a bean of type ObservationRegistry"로 기동 실패한다.
    // 덤으로 /actuator/health가 생겨 docker-compose healthcheck에 쓴다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── DB ──
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // ── Spring AI: Gemini + pgvector ──
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'org.springframework.ai:spring-ai-rag'

    // ── QueryDSL (설비 이력 동적 조회) ──
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 문자열 유사도 — 설비 매칭(중복 레코드 방지)에 사용
    implementation 'org.apache.commons:commons-text:1.12.0'

    // ── JWT ──
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ── 법정 서식 PDF (HTML → 헤드리스 크롬) ──
    implementation 'com.microsoft.playwright:playwright:1.52.0'

    implementation 'org.apache.pdfbox:pdfbox:3.0.5'   // KOSHA GUIDE PDF 텍스트 추출 (근거 청크)

    // ── 로컬 캐시 (공공 API 응답) ──
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // ── Lombok ──
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── 테스트 ──
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}
